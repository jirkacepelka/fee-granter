[package]
name = "gas-vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[dependencies]
# Secret's fork, not upstream cosmwasm-std. `stargate` is what puts
# CosmosMsg::Stargate in the enum and makes the wasm export requires_stargate,
# which the chain checks at upload against its advertised capabilities.
# Aliased to the upstream names: #[entry_point] expands to code that refers to
# `cosmwasm_std`, and Secret's fork keeps that path inside the macro.
cosmwasm-std = { package = "secret-cosmwasm-std", version = "1.1.11", features = ["stargate"] }
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"
prost = { version = "0.11", default-features = false, features = ["prost-derive"] }
