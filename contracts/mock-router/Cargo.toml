[package]
name = "mock-router"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[dependencies]
cosmwasm-std = { package = "secret-cosmwasm-std", version = "1.1.11" }
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
